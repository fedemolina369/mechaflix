<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Migrador a Firebase</title>
  <style>
    body { background: #141414; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
    input[type="file"] { margin-bottom: 20px; font-size: 16px; }
    button { padding: 15px 30px; font-size: 18px; background: #e50914; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #b20710; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Migrador de Catálogo</h1>
  <p>1. Selecciona tu archivo <b>peliculas.json</b> de tu computadora:</p>
  
  <input type="file" id="archivo-json" accept=".json">
  <br>
  <button id="btn-migrar" disabled>🚀 Subir Películas a Firebase</button>
  
  <h2 id="estado" style="color: #4caf50; margin-top: 20px;"></h2>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración exacta
    const firebaseConfig = {
      apiKey: "AIzaSyCYu2A2NU1pjoX5BrAj1g9JSg-BnKh0OHg",
      authDomain: "mechaflix1.firebaseapp.com",
      projectId: "mechaflix1",
      storageBucket: "mechaflix1.firebasestorage.app",
      messagingSenderId: "1037030873563",
      appId: "1:1037030873563:web:0f2d8fd5e52befb897affe",
      measurementId: "G-RRS18B8Y20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let peliculasAsubir = [];

    // Cuando el usuario selecciona el archivo, lo leemos
    document.getElementById('archivo-json').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          peliculasAsubir = JSON.parse(e.target.result);
          document.getElementById('estado').innerText = `¡Archivo leído! Se encontraron ${peliculasAsubir.length} películas listas para subir.`;
          document.getElementById('btn-migrar').disabled = false;
        } catch (error) {
          document.getElementById('estado').style.color = "red";
          document.getElementById('estado').innerText = "Error: El archivo no tiene un formato JSON válido.";
        }
      };
      reader.readAsText(file);
    });

    // Cuando el usuario hace clic en el botón de subir
    document.getElementById('btn-migrar').addEventListener('click', async () => {
      const estado = document.getElementById('estado');
      const btn = document.getElementById('btn-migrar');
      
      btn.disabled = true;
      estado.style.color = "#ffeb3b";
      estado.innerText = `Subiendo ${peliculasAsubir.length} películas. No cierres la ventana...`;
      
      try {
        let contador = 0;
        for (const peli of peliculasAsubir) {
          await addDoc(collection(db, "peliculas"), peli);
          contador++;
          estado.innerText = `Subiendo... (${contador} de ${peliculasAsubir.length})`;
        }

        estado.style.color = "#4caf50";
        estado.innerText = "¡Migración 100% completada! Revisa tu consola de Firebase.";
      } catch (error) {
        estado.style.color = "red";
        estado.innerText = "Error al conectar con Firebase. Revisa la consola con F12.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
